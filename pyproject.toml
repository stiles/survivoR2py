[project]
name = "survivor2py"
version = "0.1.0"
description = "Convert the survivoR R package datasets to CSV and JSON for Python users"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "requests>=2.33.0",
    "boto3>=1.35",
    "numpy>=2",
    "beautifulsoup4>=4.12",
    "pyreadr>=0.5.3",
]

[tool.uv]
package = false
